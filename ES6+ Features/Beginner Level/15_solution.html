// Create a JavaScript function to use arrow functions in event listeners. (Concept: Arrow
// Functions)

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ES6</title>
</head>
<body>
    <button>Click me</button>
    <script>
        const btn = document.querySelector('button');
        btn.addEventListener("click", ()=> {
            alert(`Button Clicked`)
            setTimeout(() => {
                window.location.reload()
            }, 2000);
        })
    </script>
</body>
</html>
